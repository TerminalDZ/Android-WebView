apply plugin: 'com.onesignal.androidsdk.onesignal-gradle-plugin'
apply plugin: 'com.android.application'
apply plugin: 'com.google.gms.google-services'
// Re-add once Firebase BOM ships with a publishable firebase-sessions:
// apply plugin: 'com.google.firebase.crashlytics'
// apply plugin: 'com.google.firebase.firebase-perf'

android {
    namespace 'com.iba.myappname'
    compileSdk 34

    defaultConfig {
        applicationId "com.iba.webview"
        minSdkVersion 23
        targetSdkVersion 34
        versionCode 2
        versionName "2.0"
        multiDexEnabled true
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        // OneSignal App ID — replace with yours from https://onesignal.com
        def onesignalAppId = '"xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx"'
        manifestPlaceholders = [
                onesignal_app_id: onesignalAppId,
                onesignal_google_project_number: 'REMOTE'
        ]
        buildConfigField "String", "ONESIGNAL_APP_ID", onesignalAppId

        vectorDrawables.useSupportLibrary = true
    }

    buildTypes {
        debug {
            debuggable true
            buildConfigField "Boolean", "IS_DEBUG_MODE", 'true'
        }
        release {
            minifyEnabled true
            shrinkResources true
            buildConfigField "Boolean", "IS_DEBUG_MODE", 'false'
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        buildConfig true
        viewBinding true
    }

    // White-label scaffold: clone the `iba` block to ship a customized build
    // for a different brand without changing any source.
    flavorDimensions += "tenant"
    productFlavors {
        iba {
            dimension "tenant"
            // Default flavor — keeps applicationId clean
        }
        // Example second tenant. Uncomment and customize to ship another brand:
        // demo {
        //     dimension "tenant"
        //     applicationIdSuffix ".demo"
        //     versionNameSuffix "-demo"
        //     resValue "string", "app_name", "Demo App"
        //     buildConfigField "String", "OVERRIDE_HOME_URL", '"https://demo.example.com"'
        // }
    }

    packagingOptions {
        resources {
            excludes += [
                    'META-INF/DEPENDENCIES',
                    'META-INF/LICENSE',
                    'META-INF/LICENSE.txt',
                    'META-INF/license.txt',
                    'META-INF/NOTICE',
                    'META-INF/NOTICE.txt',
                    'META-INF/notice.txt',
                    'META-INF/ASL2.0',
                    'META-INF/*.kotlin_module'
            ]
        }
    }

    lint {
        abortOnError true
        checkReleaseBuilds true
        baseline file("lint-baseline.xml")
        // Don't fail the build on missing translations — multi-language is optional.
        disable 'MissingTranslation', 'GoogleAppIndexingWarning'
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])

    // AndroidX core
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'androidx.browser:browser:1.8.0'
    implementation 'androidx.annotation:annotation:1.8.2'
    implementation 'androidx.multidex:multidex:2.0.1'
    implementation 'androidx.work:work-runtime:2.9.1'
    implementation 'androidx.core:core-splashscreen:1.0.1'
    implementation 'androidx.biometric:biometric:1.1.0'
    // Lifecycle 2.6.2 — stable across all the SDKs we pull in (firebase, pushwoosh, onesignal v4)
    implementation 'androidx.lifecycle:lifecycle-process:2.6.2'
    implementation 'androidx.lifecycle:lifecycle-runtime:2.6.2'
    implementation 'androidx.lifecycle:lifecycle-common-java8:2.6.2'

    // Force-align every transitively pulled lifecycle artifact to the same version
    // so ProcessLifecycleInitializer can find ReportFragment$ActivityInitializationListener.
    constraints {
        implementation('androidx.lifecycle:lifecycle-livedata:2.6.2')
        implementation('androidx.lifecycle:lifecycle-livedata-core:2.6.2')
        implementation('androidx.lifecycle:lifecycle-viewmodel:2.6.2')
        implementation('androidx.lifecycle:lifecycle-viewmodel-savedstate:2.6.2')
        implementation('androidx.lifecycle:lifecycle-runtime-ktx:2.6.2')
        implementation('androidx.lifecycle:lifecycle-common:2.6.2')
    }
    implementation 'androidx.security:security-crypto:1.1.0-alpha06'
    implementation 'androidx.webkit:webkit:1.12.1'

    // Material 3
    implementation 'com.google.android.material:material:1.12.0'

    // Firebase
    implementation platform('com.google.firebase:firebase-bom:33.5.1')
    implementation 'com.google.firebase:firebase-analytics'
    implementation 'com.google.firebase:firebase-messaging'

    // OneSignal v4 (kept for backward compatibility — see IMPROVEMENTS.md to migrate to v5)
    implementation 'com.onesignal:OneSignal:[4.0.0, 4.99.99]'

    // Pushwoosh
    implementation 'com.pushwoosh:pushwoosh-firebase:6.7.16'

    // Google Play Services / Ads / Billing
    implementation 'com.google.android.gms:play-services-ads:23.4.0'
    implementation 'com.google.android.gms:play-services-location:21.3.0'
    implementation 'com.android.billingclient:billing:7.1.1'

    // Play Integrity (root / tamper detection — see Config.USE_PLAY_INTEGRITY)
    implementation 'com.google.android.play:integrity:1.4.0'

    // Crashlytics & firebase-perf are temporarily disabled — BOM 33.5.1 has a
    // broken transitive constraint on firebase-sessions:[15.0.0, 16.0.0).
    // Re-enable on a fixed BOM:
    // implementation 'com.google.firebase:firebase-crashlytics'
    // implementation 'com.google.firebase:firebase-perf'

    // Room (for the notification inbox)
    implementation 'androidx.room:room-runtime:2.6.1'
    annotationProcessor 'androidx.room:room-compiler:2.6.1'

    // Baseline Profile installer — picks up Play Store-delivered profiles or
    // a local module-generated one to speed up cold start.
    implementation 'androidx.profileinstaller:profileinstaller:1.4.1'

    // Facebook Audience Network
    implementation 'com.facebook.android:audience-network-sdk:6.18.0'

    // Image loading
    implementation 'com.github.bumptech.glide:glide:5.0.7'
    annotationProcessor 'com.github.bumptech.glide:compiler:5.0.7'

    // GIF support for splash
    implementation 'pl.droidsonroids.gif:android-gif-drawable:1.2.28'

    // QR Code Scanner (ZXing — modern, AndroidX-native ScanContract API)
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'

    // File picker (kept for backward compatibility)
    implementation 'com.github.jaiselrahman:FilePicker:1.3.2'

    // JSON utilities
    implementation 'com.google.code.gson:gson:2.11.0'

    // Tests
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.mockito:mockito-core:5.13.0'
    testImplementation 'androidx.arch.core:core-testing:2.2.0'

    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
    androidTestImplementation 'androidx.test.espresso:espresso-web:3.6.1'
}
